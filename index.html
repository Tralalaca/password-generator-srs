<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор сложных паролей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Локальный инструмент</p>
      <h1>Генератор сложных паролей</h1>
      <p class="intro">Выберите параметры и создайте пароль прямо в браузере.</p>
    </header>

    <form id="generatorForm" class="card" novalidate>
      <div class="field-heading">
        <label for="passwordLength">Длина пароля</label>
        <span class="field-hint">От 6 до 128 символов</span>
      </div>
      <input id="passwordLength" name="length" type="number" min="6" max="128" step="1" value="16" inputmode="numeric" aria-describedby="lengthError">
      <p id="lengthError" class="field-error" role="alert"></p>

      <fieldset aria-describedby="setsError">
        <legend>Типы символов</legend>
        <div class="options-grid">
          <label class="option"><input id="lowercase" type="checkbox" checked> Строчные буквы <span>a-z</span></label>
          <label class="option"><input id="uppercase" type="checkbox" checked> Заглавные буквы <span>A-Z</span></label>
          <label class="option"><input id="digits" type="checkbox" checked> Цифры <span>0-9</span></label>
          <label class="option"><input id="symbols" type="checkbox" checked> Специальные символы <span>!@#…</span></label>
        </div>
      </fieldset>
      <p id="setsError" class="field-error" role="alert"></p>

      <label class="option option-wide"><input id="excludeSimilar" type="checkbox"> Исключить похожие символы <span>O, 0, o, l, 1, I</span></label>
      <button id="generateButton" class="primary-button" type="submit">Сгенерировать</button>
    </form>

    <section class="card result-card" aria-labelledby="resultHeading">
      <h2 id="resultHeading">Результат</h2>
      <output id="passwordOutput" class="password-output" aria-live="polite">Пароль ещё не создан</output>
      <button id="copyButton" class="secondary-button" type="button" disabled>Копировать</button>
      <p id="strengthOutput" aria-live="polite"></p>
      <p id="recommendation"></p>
      <p id="statusMessage" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
