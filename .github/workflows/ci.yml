name: CI - Code Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate HTML structure
        run: test -f index.html

      - name: Validate CSS file
        run: test -f style.css

      - name: Validate JavaScript file
        run: test -f script.js

      - name: Basic syntax check
        run: node --check script.js

      - name: Run requirement tests
        run: node --test tests/generator.test.js

